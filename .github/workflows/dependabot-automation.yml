name: Dependabot Helper & Review Enforcement

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    pull-requests: write
    issues: write
    contents: read

jobs:
    dependabot-review:
        name: Dependabot Metadata & Review Checklist
        runs-on: ubuntu-latest
        if: github.actor == 'dependabot[bot]'
        steps:
            - name: Fetch Dependabot Metadata
              id: metadata
              uses: dependabot/fetch-metadata@v2
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            - name: Add Dynamic Labels
              uses: actions/github-script@v7
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"
                  script: |
                      const updateType = '${{ steps.metadata.outputs.update-type }}';
                      const alertState = '${{ steps.metadata.outputs.alert-state }}';
                      const labelsToAdd = ['needs-human-review'];

                      if (updateType === 'version-update:semver-major') {
                        labelsToAdd.push('breaking-change');
                      } else if (updateType === 'version-update:semver-minor') {
                        labelsToAdd.push('minor-update');
                      } else if (updateType === 'version-update:semver-patch') {
                        labelsToAdd.push('patch-update');
                      }

                      if (alertState) {
                        labelsToAdd.push('security-fix');
                      }

                      await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        labels: labelsToAdd
                      });

            - name: Post Human Review Checklist
              if: github.event.action == 'opened'
              uses: actions/github-script@v7
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"
                  script: |
                      const depNames = '${{ steps.metadata.outputs.dependency-names }}';
                      const depType = '${{ steps.metadata.outputs.dependency-type }}';
                      const updateType = '${{ steps.metadata.outputs.update-type }}';

                      const body = `### 🤖 Dependabot PR Assessment

                      **Paket**: \`${depNames}\`
                      **Tipe Dependensi**: \`${depType}\`
                      **Tipe Pembaruan**: \`${updateType}\`

                      ---

                      ### 📋 Human Review & Verification Checklist
                      Sebelum melakukan **Merge**, pastikan tahapan verifikasi berikut telah dilakukan:
                      - [ ] **CI Status**: Seluruh pipeline CI (ESLint, Typecheck, Vitest, Storybook, Playwright E2E) berstatus **HIJAU / PASSED**.
                      - [ ] **Changelog & Breaking Changes**: Tinjau release notes paket yang diperbarui untuk memastikan tidak ada perubahan breaking yang mempengaruhi aplikasi.
                      - [ ] **Manual Sanity Check**: Jika pembaruan bersifat major, lakukan uji coba manual pada fitur terkait.

                      > ⚠️ **Kebijakan Keamanan**: Auto-merge dinonaktifkan. Penggabungan dependensi membutuhkan persetujuan (_approval_) dari human reviewer.`;

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        body: body
                      });
